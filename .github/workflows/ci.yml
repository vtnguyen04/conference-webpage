name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npm run check

    - name: Prepare Database
      run: npm run db:push

    - name: Run Tests
      run: npm test

    - name: Build Application
      run: npm run build
      env:
        NODE_ENV: production

